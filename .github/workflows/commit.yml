---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Workflow: Commit
# Version:  2.0.0
# Author:   Michael Bragg <mike@vatu.dev>

name: 'Commit'

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}--${{ github.ref_name || github.head_ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: "1" # https://getcomposer.org/doc/03-cli.md#composer-allow-superuser

jobs:

  php-security:
    name: 'PHP Security Analysis'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-version:
          - '8.4'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up PHP environment.'
        uses: 'shivammathur/setup-php@2.37.2'
        with:
          coverage: 'none'
          ini-values: "memory_limit=-1"
          tools: 'composer'
          ini-file: none
          php-version: "${{ matrix.php-version }}"
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}

      - name: "Add Composer config."
        run: |
          composer config http-basic.satispress.vatu.dev ${{ secrets.COMPOSER_VATU_USERNAME }} ${{ secrets.COMPOSER_VATU_KEY }}

      - name: 'Validate Composer file.'
        run: |
          composer validate --ansi

      - name: 'Logs debug information.'
        run: |
          php --version
          composer --version

      - name: 'Run security test.'
        run: |
          composer test:security

  node-security:
    name: 'NPM Security Analysis'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        node-version:
          - '24'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.0'

      - name: 'Set up Node environment.'
        uses: 'actions/setup-node@v6.4.0'
        with:
          node-version: "${{ matrix.node-version }}"
          token: ${{ secrets.github-token }}
          cache: 'npm'

      - name: 'Logs debug information.'
        run: |
          node --version
          npm --version

      - name: 'Install dependencies.'
        run: |
          npm install

      - name: 'Run security test.'
        run: |
          npm audit --omit=dev

  php-lint:
    name: 'PHP Lint'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-version:
          - '8.4'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up PHP environment.'
        uses: 'shivammathur/setup-php@2.37.2'
        with:
          coverage: 'none'
          ini-values: "memory_limit=-1"
          tools: 'composer'
          ini-file: none
          php-version: "${{ matrix.php-version }}"
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}

      - name: 'Validate Composer file.'
        run: |
          composer validate --ansi

      - name: 'Get Composer Cache Directory.'
        id: 'composer-cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Sets up Composer Caching.'
        uses: 'actions/cache@v6.1.0'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock','tools/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: 'Install dependencies.'
        run: |
          composer install --working-dir=tools --no-interaction --prefer-dist

      - name: 'Logs debug information.'
        run: |
          php --version
          composer --version
          php ./tools/vendor/bin/parallel-lint --version
          php ./tools/vendor/bin/phpcs --version

      - name: 'Run PHP Lint tests.'
        run: |
          composer test:lint

  node-lint:
    name: 'Node Lint'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        node-version:
          - '24'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: "Setup NodeJS environment"
        uses: "actions/setup-node@v7.0.0"
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: "Logs debug information."
        run: |
          node --version
          npm --version

      - name: "Install Node Modules."
        run: |
          npm install

      - name: "Compile Theme."
        run: |
          npm run build

  php-analysis:
    name: 'PHP Analysis'
    needs:
      - 'php-security'
      - 'php-lint'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-version:
          - '8.4'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up PHP environment.'
        uses: 'shivammathur/setup-php@2.37.2'
        with:
          coverage: 'none'
          ini-values: "memory_limit=-1"
          tools: 'composer'
          ini-file: none
          php-version: "${{ matrix.php-version }}"
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}

      - name: 'Validate Composer file.'
        run: |
          composer validate --working-dir=tools --ansi
          composer validate --ansi --strict

      - name: "Add Composer config."
        env:
          COMPOSER_USERNAME: ${{ secrets.COMPOSER_VATU_USERNAME }}
          COMPOSER_KEY: ${{ secrets.COMPOSER_VATU_KEY }}
        if: ${{ $COMPOSER_KEY != '' }}
        run: |
          composer config http-basic.satispress.vatu.dev "$COMPOSER_KEY" "$COMPOSER_KEY"

      - name: 'Get Composer Cache Directory.'
        id: 'composer-cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Sets up Composer Caching.'
        uses: 'actions/cache@v6.1.0'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock','tools/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: "Build site."
        run: |
          composer install --no-interaction --prefer-dist --no-scripts --no-dev

      - name: 'Install dependencies.'
        run: |
          composer install --working-dir=tools --no-interaction --prefer-dist

      - name: 'Logs debug information.'
        run: |
          php --version
          composer --version
          php ./tools/vendor/bin/phpstan --version

      - name: 'Run PHP Analysis tests.'
        run: |
          composer run test:analysis -- --memory-limit 8G

  php-compatibility:
    name: 'PHP Compatiblity'
    needs:
      - 'php-security'
      - 'php-lint'
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.4'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up PHP environment.'
        uses: 'shivammathur/setup-php@2.37.2'
        with:
          coverage: 'none'
          ini-values: "memory_limit=-1"
          tools: 'composer'
          ini-file: none
          php-version: "${{ matrix.php-version }}"
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}

      - name: 'Logs debug information.'
        run: |
          php --version
          composer --version

      - name: 'Get Composer Cache Directory.'
        id: 'composer-cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Sets up Composer Caching.'
        uses: 'actions/cache@v6.1.0'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock','tools/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: "Install dependencies."
        run: |
          composer install --no-interaction --prefer-dist

      - name: 'Run Compatibility tests.'
        run: |
          composer run test:compatibility -- --runtime-set testVersion ${{ matrix.php-version }}

  php-unit:
    name: 'PHP Unit Tests'
    runs-on: 'ubuntu-24.04'
    needs:
      - 'php-analysis'
      - 'php-compatibility'

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-version:
          - '8.4'

    steps:

      - name: 'Check out the repository.'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up PHP environment.'
        uses: 'shivammathur/setup-php@2.37.2'
        with:
          coverage: 'none'
          ini-values: "memory_limit=-1"
          tools: 'composer'
          ini-file: none
          php-version: "${{ matrix.php-version }}"
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}

      # - name: "Add Composer config."
      #   run: |
      #     composer config http-basic.satispress.vatu.dev ${{ secrets.COMPOSER_VATU_USERNAME }} ${{ secrets.COMPOSER_VATU_KEY }}

      - name: 'Validate Composer file.'
        run: |
          composer validate --working-dir=tools --ansi
          composer validate --ansi --strict

      - name: 'Get Composer Cache Directory.'
        id: 'composer-cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Sets up Composer Caching.'
        uses: 'actions/cache@v6.1.0'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock','tools/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: 'Install dependencies.'
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 'Logs debug information.'
        run: |
          php --version
          composer --version
          php ./tools/vendor/bin/phpunit --version

      - name: 'Run PHP Unit tests.'
        run: |
          composer dump-autoload --dev
          composer run test:unit

  acceptance:
    name: 'Acceptance'
    runs-on: 'ubuntu-24.04'
    needs:
     - 'php-unit'
    steps:

      - name: 'Skip'
        run: |
          echo "Skipped"

  notify-failure:
    name: "Notify on failure."
    needs:
     - php-security
     - php-lint
     - node-lint
     - php-analysis
     - php-compatibility
     - php-unit
     - acceptance
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: 'ubuntu-24.04'
    steps:
      - name: "Failure notification."
        id: 'slack'
        uses: 'slackapi/slack-github-action@v4.0.0'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL }}"
            text: "${{ github.workflow }} workflow failed for ${{ github.event.repository.name }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.workflow }} workflow failed for ${{ github.event.repository.name }}.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
