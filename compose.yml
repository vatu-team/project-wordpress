  #     - public
  #     - private
  #   profiles:
  #     - dev

# ============================================================================ #
# Database                                                                     #
# ============================================================================ #

  mariadb:
    container_name: "mariadb"
    build:
      dockerfile: ./.docker/mariadb/Dockerfile
      context: .
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root}
      - MARIADB_AUTO_UPGRADE=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./.docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./.docker/databases/mariadb:/var/lib/mysql:delegated
      - ./shared/logs/mysql/:/var/log/mysql/:delegated
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: "redis"
    build:
      dockerfile: ./.docker/redis/Dockerfile
      context: .
    restart: unless-stopped
    ports:
      - ${REDIS_PORT:-6379}:6379
    command: redis-server
    volumes:
      - ./.docker/databases/redis:/data:delegated
      - ./shared/logs/redis/:/usr/local/var/db/redis/:delegated

# ============================================================================ #
# Development                                                                  #
# ============================================================================ #

  node-cli:
    container_name: "node-cli"
    build:
      dockerfile: ./.docker/node/Dockerfile
      context: .
      args:
        USER_ID: ${USER_ID:-10000}
        GROUP_ID: ${GROUP_ID:-10001}
        NODE_VERSION: ${PROJECT_NODE_VERSION:-24}
    environment:
      SHELL: "/bin/bash"
    working_dir: ${PROJECT_DIR:-/var/www}
    volumes:
      - "./:/var/www/:delegated"
    profiles:
      - dev

# ============================================================================ #
# Mail                                                                         #
# ============================================================================ #

  mail:
    container_name: "mail"
    build:
      dockerfile: ./.docker/mailpit/Dockerfile
      context: .
    restart: unless-stopped
    volumes:
      - ./.docker/databases/mailpit:/data
    ports:
      - ${MAIL_UI_PORT:-8025}:8025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
