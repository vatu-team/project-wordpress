  #       USER_ID: ${USER_ID:-10000}
  #       GROUP_ID: ${GROUP_ID:-10001}
  #       USER_NAME: cli
  #       GROUP_NAME: cli
  #       CODE_PATH: ${PROJECT_DIR:-/var/www}
  #       PHP_VERSION: ${PHP_VERSION:-8.2}
